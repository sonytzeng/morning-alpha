name: Academy member candidate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  academy-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-academy-only
        ports: [55439:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Real PostgreSQL role and entitlement isolation (not real Owner E2E)
        env:
          MA_ACADEMY_TEST_HOST: 127.0.0.1
          MA_ACADEMY_TEST_USER: postgres
          PGPASSWORD: isolated-academy-only
        run: node --experimental-strip-types scripts/academy-v11/fresh-db.mjs
      - name: Real local Supabase Auth password login and PostgREST RLS
        run: node scripts/academy-v11/auth-environment.mjs
