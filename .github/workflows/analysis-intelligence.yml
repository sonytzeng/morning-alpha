name: Analysis intelligence gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports: [55440:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGUSER: postgres
      PGPASSWORD: isolated-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --test tests/analysisIntelligence*.test.mjs
      - name: Fresh research-only database, immutable replay and Owner RLS
        env:
          MA_ISOLATED_TEST_DB: ma_phase2_analysis_test1
          MA_TEST_PGPORT: 55440
        run: node tests/analysisIntelligenceDatabase.integration.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-lock supabase/functions/research-analysis-shadow-v1/index.ts
