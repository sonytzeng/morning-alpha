name: Validate checkpoint atomicity

on:
  push:
    branches:
      - codex/p0-checkpoint-atomicity-20260911
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/checkpoint-atomicity-validation.yml'
      - '.github/workflows/morning-alpha-runtime-checkpoints.yml'
      - 'docs/operations/core-fetch-source-manifest-20260907.json'
      - 'supabase/functions/_shared/fetch-checkpoint-evidence.mjs'
      - 'supabase/functions/fetch-market-data-v10/**'
      - 'supabase/functions/opening-market-radar/**'
      - 'supabase/functions/close-market-review/**'
      - 'supabase/functions/closing-verification-engine/**'
      - 'supabase/functions/continuous-learning-engine/**'
      - 'supabase/functions/generate-sector-rotation/**'
      - 'supabase/functions/ma-ops-health-check/**'
      - 'supabase/functions/strategy-replay-engine/**'
      - 'supabase/migrations/*checkpoint_snapshot_atomic_batch_v1.sql'
      - 'tests/checkpointAtomicity*'
      - 'tests/fetchCheckpointEvidence.test.mjs'
      - 'tests/productionArchitecture.test.mjs'
      - 'tests/fixtures/checkpoint-atomicity-baseline.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-checkpoint-atomicity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      isolated-postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 55439:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGUSER: postgres
      PGPASSWORD: isolated-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - name: Affected Node contract regressions
        run: >-
          node --test
          tests/checkpointAtomicity.test.mjs
          tests/fetchCheckpointEvidence.test.mjs
          tests/productionArchitecture.test.mjs
          tests/productionReliability.test.mjs
          tests/closingLearningContract.test.mjs
          tests/continuousLearningIntegration.test.mjs
          tests/incidentHealthContract.test.mjs
          tests/publicRelease.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Affected Edge type checks
        run: >-
          deno check --no-lock
          supabase/functions/fetch-market-data-v10/index.ts
          supabase/functions/opening-market-radar/index.ts
          supabase/functions/close-market-review/index.ts
          supabase/functions/closing-verification-engine/index.ts
          supabase/functions/continuous-learning-engine/index.ts
          supabase/functions/generate-sector-rotation/index.ts
          supabase/functions/ma-ops-health-check/index.ts
          supabase/functions/strategy-replay-engine/index.ts
      - name: PostgreSQL atomicity, retry, concurrency and 1000-run fault matrix
        env:
          MA_LOCAL_SCOPE: ma-checkpoint-atomicity-20260911
          MA_ISOLATED_TEST_DB: ma_checkpoint_atomicity_test1
        run: node --test tests/checkpointAtomicityDatabase.integration.mjs
      - run: npm run build
