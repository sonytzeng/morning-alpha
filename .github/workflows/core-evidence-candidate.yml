name: Core evidence candidate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  evidence-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - env:
          NODE_OPTIONS: --experimental-strip-types
        run: npm ci
      - name: Exact candidate and original quality gates
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: >-
          node --experimental-strip-types --test
          tests/coreEvidenceCandidateIntegrity.test.mjs
          tests/recommendationMarketInstitutionalCandidate.test.mjs
          tests/decisionEvidencePipeline.test.mjs
          tests/recommendationProducer.test.mjs
          tests/recommendationReaderBinding.test.mjs
          tests/ciEvidenceDatabaseImage.test.mjs
      - name: Prepare fixed PostgreSQL 17.11 image for this isolated runner
        timeout-minutes: 3
        env:
          # Same official postgres:17 / 17.11 linux-amd64 image, observed
          # 2026-10-22. Other jobs' Docker caches do not exist on this runner.
          TEST_POSTGRES_IMAGE: postgres@sha256:3518071376d0b6156b02e1db2747a78511b5b9dc3763cc79c506ebe2dc2ee71c
        run: |
          set -euo pipefail
          timeout 120s docker pull "$TEST_POSTGRES_IMAGE"
          test "$(docker image inspect "$TEST_POSTGRES_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          docker run --rm --pull never --network none "$TEST_POSTGRES_IMAGE" postgres --version | grep -E '^postgres \(PostgreSQL\) 17\.11([[:space:]]|$)'
          docker tag "$TEST_POSTGRES_IMAGE" postgres:17
      - name: Disposable SQL and RLS, no Production connectivity
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: node --experimental-strip-types tests/recommendationMarketInstitutionalDatabase.integration.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: >-
          deno check --no-lock
          supabase/functions/_shared/recommendation-market-institutional-candidate.ts
          supabase/functions/_shared/recommendation-foundation-candidate.ts
          supabase/functions/recommendation-stock-evidence-v1/index.ts
          supabase/functions/get-report-payload/index.ts
