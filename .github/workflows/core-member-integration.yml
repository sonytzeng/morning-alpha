name: Core member integration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - env:
          NODE_OPTIONS: --experimental-strip-types
        run: npm ci
      - name: Admit the complete current source before checking historical Worker artifacts
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: |
          node --input-type=module -e "import {verifyIntegrationCandidate} from './tests/helpers/integrationAdmission.mjs';verifyIntegrationCandidate();"
          node --experimental-strip-types --test tests/cWorkerRpcDiagnosticsAdmission.test.mjs
      - name: Current C Worker fixed-SDK diagnostic protocol with denied network ports
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: node --experimental-vm-modules --require ./tests/helpers/cWorkerLocalSdkNetworkDenied.cjs --test --test-concurrency=1 tests/cWorkerRpcFailureDiagnostics.integration.mjs
      - name: Check out the immutable pre-C-diagnostic source proofs only
        uses: actions/checkout@v4
        with:
          ref: 965263fe15dc672cac6c61af06bfd14d69044dd3
          path: build/c-worker-rpc-historical-base
          fetch-depth: 0
          persist-credentials: false
      - name: Historical 965 source-acquisition and workflow admission proofs unchanged
        working-directory: build/c-worker-rpc-historical-base
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: node --experimental-strip-types --test tests/integrationAdmission.test.mjs tests/recommendationV2SourceAcquisitionAdmission.test.mjs
      - name: Check out the immutable pre-source-acquisition Owner admission proofs only
        uses: actions/checkout@v4
        with:
          ref: 6b7017fcbb9fa2fd085f9658eca4d6ce382c32a3
          path: build/source-acquisition-historical-base
          fetch-depth: 0
          persist-credentials: false
      - name: Historical 6b7017 Owner regime source and negative admission controls
        working-directory: build/source-acquisition-historical-base
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: node --experimental-strip-types --test tests/ownerRegimeDisplayAdmission.test.mjs
      - name: Check out the immutable pre-regime Owner source proofs only
        uses: actions/checkout@v4
        with:
          ref: a3602de17198dd9b769a16671ed97c4763e21cd8
          path: build/owner-regime-historical-base
          fetch-depth: 0
          persist-credentials: false
      - name: Install the immutable Owner source proof dependencies without lifecycle scripts
        working-directory: build/owner-regime-historical-base
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: npm ci --ignore-scripts
      - name: Historical a360 B24 and Owner-copy source assertions including type-only runtime equivalence
        working-directory: build/owner-regime-historical-base
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: node --experimental-strip-types --test tests/ownerStatusCopyAdmission.test.mjs tests/frontendTypeClosureAdmission.test.mjs tests/researchSourceContracts.test.mjs tests/ownerReleaseReviewPackage.test.mjs tests/r9FunctionalSourceClosure.test.mjs
      - name: Check out the immutable Worker packaging baseline only
        uses: actions/checkout@v4
        with:
          ref: 6c89db33ade7b8f3a57e00da6708afe1958ed8f6
          path: build/priced-in-historical-base
          fetch-depth: 0
          persist-credentials: false
      - name: Install the fixed historical artifact test dependencies without lifecycle scripts
        working-directory: build/priced-in-historical-base
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: npm ci --ignore-scripts
      - name: Historical 6c89 Worker local-SDK repair and recovery packaging (no HTTP)
        working-directory: build/priced-in-historical-base
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: |
          node --require ./tests/helpers/cWorkerLocalSdkNetworkDenied.cjs scripts/operations/c-worker-local-sdk-release-20261019/materialize.mjs repair
          node --require ./tests/helpers/cWorkerLocalSdkNetworkDenied.cjs scripts/operations/c-worker-local-sdk-release-20261019/materialize.mjs recovery
      - name: Historical 6c89 Worker fixed SDK and lease handoff under denied network ports
        working-directory: build/priced-in-historical-base
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: node --experimental-vm-modules --require ./tests/helpers/cWorkerLocalSdkNetworkDenied.cjs --test --test-concurrency=1 tests/cWorkerLocalSdkRelease.test.mjs tests/cWorkerLocalSdkRuntime.integration.mjs
      - name: Install the exact current Reader SDK separately from the historical frontend SDK
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: npm install --prefix build/content-os-reader-sdk --no-save @supabase/supabase-js@2.115.0
      - name: Public market regime projection and exact Reader SDK regressions
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: node --experimental-strip-types --test tests/publicMarketProjection.test.mjs
      - name: Offline official Actuals parser (isolated fixtures only)
        run: python3 -B -m unittest discover -s tests -p test_inline_xbrl.py -v
      - name: V1 mixed fundamentals, measured price coverage and global refusal regressions
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: node --experimental-strip-types --test tests/decisionEvidencePipeline.test.mjs tests/recommendationPhase.test.mjs tests/decisionPricedInCoverage.test.mjs
      - name: Retained four-quarter Owner earnings and source view without formal or member admission
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: node --experimental-strip-types --test --test-concurrency=1 tests/recommendationQuarterActualsCandidate.test.mjs tests/ownerQuarterActualsView.test.mjs tests/recommendationReaderBinding.test.mjs tests/stockOfficialActuals.test.mjs tests/lineDecisionCardV2.test.mjs
      - env:
          NODE_OPTIONS: --experimental-strip-types
        run: node --experimental-strip-types --test tests/memberContinuityAdmission.test.mjs tests/ownerTradingLab.test.mjs tests/ownerTradingLabUI.test.mjs tests/ownerCockpit.test.mjs tests/recommendationV2UI.test.mjs tests/vnextMemberContinuity.test.mjs tests/vnextMember.test.mjs tests/recommendationHistoricalBatch.test.mjs tests/coreEvidenceCandidateIntegrity.test.mjs tests/stagedReleaseIntegrity.test.mjs tests/vnextIntegrity.test.mjs tests/recommendationMarketInstitutionalCandidate.test.mjs tests/researchOwnerFieldAccess.test.mjs tests/recommendationConsensusCapability.test.mjs tests/finnhubQuarterlyProbe.test.mjs tests/providerCapabilityOwnerBoundary.test.mjs tests/accountReportSchedule.test.mjs tests/accountSubscriberProjection.test.mjs tests/providerCapabilityReviewUi.test.mjs tests/ownerAccountAnalysisNavigation.test.mjs tests/analysisIntelligenceUI.test.mjs tests/accountDashboardIdentity.test.mjs tests/accountHistoricalFallback.test.mjs tests/stockOfficialActuals.test.mjs tests/recommendationFinancialActualsCandidate.test.mjs tests/recommendationEventAlignment.test.mjs
      - env:
          NODE_OPTIONS: --experimental-strip-types
        run: npm run type-check
      - env:
          NODE_OPTIONS: --experimental-strip-types
        run: npm run lint
      - env:
          NODE_OPTIONS: --experimental-strip-types
        run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --no-lock --allow-read tests/researchOwnerFieldAccess.sdk.test.ts tests/providerCapabilityEntry.sdk.test.ts
      - run: deno check --no-lock supabase/functions/vnext-daily-research-v1/index.ts supabase/functions/get-report-payload/index.ts supabase/functions/recommendation-stock-evidence-v1/index.ts supabase/functions/v1-provider-capability-review-v1/index.ts
      - run: node --experimental-strip-types --test tests/eventAlignmentRefresh.test.mjs tests/recommendationIssuerEventReview.test.mjs tests/r10FunctionalSourceClosure.test.mjs
        env:
          NODE_OPTIONS: --experimental-strip-types
      - run: deno check --no-lock supabase/functions/_shared/recommendation-financial-actuals-candidate.ts research/recommendation-event-alignment-candidate.ts research/recommendation-issuer-event-review-candidate.ts
      - run: node --experimental-strip-types tests/membershipPolicy.integration.mjs
        env:
          NODE_OPTIONS: --experimental-strip-types
          MA_ISOLATED_DB_TMPFS: '1'
      - run: node --experimental-strip-types tests/providerCapabilityClaimDatabase.integration.mjs
        env:
          NODE_OPTIONS: --experimental-strip-types
          MA_ISOLATED_DB_TMPFS: '1'
      - name: Preserve historical a360 B24 and Owner-copy source packages without relabeling current regime code
        working-directory: build/owner-regime-historical-base
        env:
          NODE_OPTIONS: --experimental-strip-types
          MEMBER_UI_ARTIFACT_DIR: ${{ runner.temp }}/morning-alpha-frontend-type-closure-ui
          MEMBER_UI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import {mkdirSync,writeFileSync,existsSync} from 'node:fs';
          import {ownerStatusCopyHistoricalFsRead as readFileSync,verifyOwnerStatusCopy,ownerStatusCopyWebsiteOperations} from './tests/helpers/ownerStatusCopyAdmission.mjs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {join,dirname} from 'node:path';
          const sha=b=>createHash('sha256').update(b).digest('hex');
          import {verifyHistoricalFrontendTypeClosureForOwnerCopy as verifyFrontendTypeClosure,historicalFrontendTypeClosureWebsiteOperationsForOwnerCopy as frontendTypeClosureWebsiteOperations} from './tests/helpers/frontendTypeClosureAdmission.mjs';
          const closure=verifyFrontendTypeClosure();
          const files=frontendTypeClosureWebsiteOperations();
          if(closure.production_authorized!==false||files.length!==24||new Set(files.map(f=>f.path)).size!==24)throw Error('FRONTEND_TYPE_CLOSURE_SCOPE');
          for(const f of files){
            if(!/^src\/[A-Za-z0-9_./-]+$/.test(f.path)||f.path.split('/').includes('..')||f.path.includes('.env')||sha(readFileSync(f.path))!==f.target_sha256)throw Error('R9_SOURCE');
          }
          const dir=process.env.MEMBER_UI_ARTIFACT_DIR,head=process.env.MEMBER_UI_HEAD;
          if(!dir||!/^\/[A-Za-z0-9_./-]+$/.test(dir)||!/^[a-f0-9]{40}$/.test(head))throw Error('R9_ARTIFACT_TARGET');
          const archive=join(dir,'member-ui24-source.zip');
          if(existsSync(archive))throw Error('R9_ARTIFACT_EXISTS');
          mkdirSync(dir,{recursive:true,mode:0o700});
          // The original B24 source view is historical; never zip the new Owner
          // bytes while labeling them as its old type-only source operation.
          const stage=join(dir,'historical-b24');
          for(const file of files){const target=join(stage,file.path);mkdirSync(dirname(target),{recursive:true});writeFileSync(target,readFileSync(file.path),{flag:'wx',mode:0o600});}
          execFileSync('zip',['-X','-q',archive,...files.map(f=>f.path)],{cwd:stage});
          const receipt={head,source_base:'a3602de17198dd9b769a16671ed97c4763e21cd8',source_view:'IMMUTABLE_B24_PRE_OWNER_COPY',source_operations:24,archive_sha256:sha(readFileSync(archive)),production_authorized:false,frontend_closure_receipt:{path:'docs/operations/evidence/frontend-type-closure-20261018.json',sha256:sha(readFileSync('docs/operations/evidence/frontend-type-closure-20261018.json'))},prior_member_receipt:{path:closure.website.predecessor_path,sha256:closure.website.predecessor_sha256},excluded_non_frontend_build_sources:closure.website.removed_build_only_paths,files};
          writeFileSync(join(dir,'receipt.json'),JSON.stringify(receipt,null,2)+'\n',{flag:'wx',mode:0o600});
          const current=verifyOwnerStatusCopy(),repair=ownerStatusCopyWebsiteOperations();
          if(repair.length!==1||repair[0].path!=='src/pages/admin/analysis/OwnerCockpit.tsx')throw Error('OWNER_COPY_EXACT_SCOPE');
          // This historical archive uses the immutable a360 physical source.
          const repairArchive=join(dir,'owner-status-copy-source.zip');
          if(existsSync(repairArchive))throw Error('OWNER_COPY_ARTIFACT_EXISTS');
          execFileSync('zip',['-X','-q',repairArchive,...repair.map(file=>file.path)]);
          const repairReceipt={head,source_base:'a3602de17198dd9b769a16671ed97c4763e21cd8',source_view:'HISTORICAL_OWNER_STATUS_COPY_A360',source_operations:1,archive_sha256:sha(readFileSync(repairArchive)),production_authorized:false,source_receipt:'docs/operations/evidence/owner-status-copy-20261019.json',files:repair,predecessor_website:current.predecessor_website};
          writeFileSync(join(dir,'owner-status-copy-receipt.json'),JSON.stringify(repairReceipt,null,2)+'\n',{flag:'wx',mode:0o600});
          NODE
      - name: Package the exact current single-file Owner regime label repair
        env:
          NODE_OPTIONS: --experimental-strip-types
          MEMBER_UI_ARTIFACT_DIR: ${{ runner.temp }}/morning-alpha-frontend-type-closure-ui
          MEMBER_UI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,existsSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {join} from 'node:path';
          import {verifyOwnerRegimeDisplay,ownerRegimeDisplayWebsiteOperations} from './tests/helpers/ownerRegimeDisplayAdmission.mjs';
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const manifest=verifyOwnerRegimeDisplay(),files=ownerRegimeDisplayWebsiteOperations();
          const dir=process.env.MEMBER_UI_ARTIFACT_DIR,head=process.env.MEMBER_UI_HEAD;
          assert.match(dir,/^\/[A-Za-z0-9_./-]+$/);assert.match(head,/^[a-f0-9]{40}$/);
          assert.equal(files.length,1);assert.equal(files[0].path,'src/features/research/cockpit.ts');
          const archive=join(dir,'owner-regime-display-source.zip');assert(!existsSync(archive));
          execFileSync('zip',['-X','-q',archive,...files.map(file=>file.path)]);
          writeFileSync(join(dir,'owner-regime-display-receipt.json'),JSON.stringify({head,source_view:'CURRENT_OWNER_REGIME_DISPLAY_SOURCE',source_operations:1,archive_sha256:sha(readFileSync(archive)),production_authorized:false,source_receipt:'docs/operations/evidence/owner-regime-display-20261019.json',files,protected_sources:manifest.protected_sources},null,2)+'\n',{flag:'wx',mode:0o600});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: morning-alpha-frontend-type-closure-ui-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/morning-alpha-frontend-type-closure-ui/
          if-no-files-found: error
          retention-days: 14
