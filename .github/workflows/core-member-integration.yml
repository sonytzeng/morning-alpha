name: Core member integration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: npm ci
      - run: node --experimental-strip-types --test tests/integrationAdmission.test.mjs tests/coreEvidenceCandidateIntegrity.test.mjs tests/stagedReleaseIntegrity.test.mjs tests/vnextIntegrity.test.mjs tests/recommendationMarketInstitutionalCandidate.test.mjs tests/researchOwnerFieldAccess.test.mjs tests/recommendationConsensusCapability.test.mjs
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --no-lock --allow-read tests/researchOwnerFieldAccess.sdk.test.ts
      - run: deno check --no-lock supabase/functions/get-report-payload/index.ts supabase/functions/recommendation-stock-evidence-v1/index.ts
      - run: node --experimental-strip-types tests/membershipPolicy.integration.mjs
        env:
          MA_ISOLATED_DB_TMPFS: '1'
