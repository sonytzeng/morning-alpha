name: Deploy Morning Alpha runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/fetch-market-data-v10/**'
      - 'supabase/functions/opening-market-radar/**'
      - 'supabase/functions/close-market-review/**'
      - 'supabase/functions/closing-verification-engine/**'
      - 'supabase/functions/ma-ops-health-check/**'
      - 'supabase/functions/generate-daily-report-v7/**'
      - 'supabase/functions/line-daily-push/**'
      - 'supabase/functions/daily-delivery-orchestrator/**'
      - 'supabase/functions/get-report-payload/**'
      - 'supabase/functions/continuous-learning-engine/**'
      - 'supabase/functions/get-learning-center/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/generate-sector-rotation/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-morning-alpha-runtime.yml'

permissions:
  contents: read

concurrency:
  group: deploy-morning-alpha-runtime
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations before runtime cutover
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link \
            --project-ref cttfzgvhiewfckydcrci \
            --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked

      - name: Deploy daily report generator
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase functions deploy generate-daily-report-v7
          --project-ref cttfzgvhiewfckydcrci
          --no-verify-jwt

      - name: Deploy LINE daily push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase functions deploy line-daily-push
          --project-ref cttfzgvhiewfckydcrci
          --no-verify-jwt

      - name: Deploy daily delivery orchestrator
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase functions deploy daily-delivery-orchestrator
          --project-ref cttfzgvhiewfckydcrci
          --no-verify-jwt

      - name: Deploy tier-safe report payload
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase functions deploy get-report-payload
          --project-ref cttfzgvhiewfckydcrci
          --no-verify-jwt

      - name: Deploy sector rotation generator
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase functions deploy generate-sector-rotation
          --project-ref cttfzgvhiewfckydcrci
          --no-verify-jwt

      - name: Deploy market data collector
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase functions deploy fetch-market-data-v10
          --project-ref cttfzgvhiewfckydcrci
          --no-verify-jwt

      - name: Deploy intraday radar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase functions deploy opening-market-radar
          --project-ref cttfzgvhiewfckydcrci
          --no-verify-jwt

      - name: Deploy closing review
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase functions deploy close-market-review
          --project-ref cttfzgvhiewfckydcrci
          --no-verify-jwt

      - name: Deploy closing verification engine
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase functions deploy closing-verification-engine
          --project-ref cttfzgvhiewfckydcrci
          --no-verify-jwt

      - name: Deploy continuous learning engine
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase functions deploy continuous-learning-engine
          --project-ref cttfzgvhiewfckydcrci
          --no-verify-jwt

      - name: Deploy admin learning center API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase functions deploy get-learning-center
          --project-ref cttfzgvhiewfckydcrci

      - name: Deploy read-only operations health check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase functions deploy ma-ops-health-check
          --project-ref cttfzgvhiewfckydcrci
          --no-verify-jwt
