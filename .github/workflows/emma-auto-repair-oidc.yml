name: Emma automatic Draft PR dispatch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: emma-auto-repair-oidc-main
  cancel-in-progress: false

jobs:
  dispatch:
    name: OIDC Draft PR dispatch
    if: github.repository == 'sonytzeng/morning-alpha' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable main workflow source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Prepare one bounded Emma Draft PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EMMA_OIDC_AUDIENCE: emma:qjgrthjpffhtxvbkfyat:morning-alpha
          EMMA_OIDC_BROKER_URL: https://qjgrthjpffhtxvbkfyat.supabase.co/functions/v1/emma-github-oidc-broker
        run: node scripts/emma-auto-repair-oidc.mjs
