name: Morning Alpha runtime checkpoints

on:
  schedule:
    # GitHub cron uses UTC. Supabase Cron is primary; these are independent watchdogs at 07:10/07:35 Taipei.
    - cron: '10 23 * * 0-4'
    - cron: '35 23 * * 0-4'
    # Six immutable Asia/Taipei market snapshots. Each checkpoint has a second
    # idempotent watchdog five minutes later so a missed GitHub trigger does not
    # silently break the trading-day chain.
    - cron: '0 1 * * 1-5'
    - cron: '5 1 * * 1-5'
    - cron: '30 1 * * 1-5'
    - cron: '35 1 * * 1-5'
    - cron: '30 2 * * 1-5'
    - cron: '35 2 * * 1-5'
    - cron: '0 5 * * 1-5'
    - cron: '5 5 * * 1-5'
    - cron: '10 6 * * 1-5'
    - cron: '15 6 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '35 6 * * 1-5'
  workflow_dispatch:
    inputs:
      checkpoint:
        description: Runtime checkpoint to execute
        required: true
        type: choice
        options:
          - premarket
          - '0900'
          - '0930'
          - '1030'
          - '1300'
          - '1410'
          - '1430'

permissions:
  contents: read

concurrency:
  group: morning-alpha-runtime-${{ (github.event.schedule == '10 23 * * 0-4' || github.event.schedule == '35 23 * * 0-4') && 'premarket' || (github.event.schedule == '0 1 * * 1-5' || github.event.schedule == '5 1 * * 1-5') && '0900' || (github.event.schedule == '30 1 * * 1-5' || github.event.schedule == '35 1 * * 1-5') && '0930' || (github.event.schedule == '30 2 * * 1-5' || github.event.schedule == '35 2 * * 1-5') && '1030' || (github.event.schedule == '0 5 * * 1-5' || github.event.schedule == '5 5 * * 1-5') && '1300' || (github.event.schedule == '10 6 * * 1-5' || github.event.schedule == '15 6 * * 1-5') && '1410' || (github.event.schedule == '30 6 * * 1-5' || github.event.schedule == '35 6 * * 1-5') && '1430' || inputs.checkpoint || github.run_id }}
  cancel-in-progress: false

env:
  FUNCTIONS_BASE_URL: https://cttfzgvhiewfckydcrci.supabase.co/functions/v1

jobs:
  resolve-checkpoint:
    runs-on: ubuntu-latest
    outputs:
      checkpoint: ${{ steps.resolve.outputs.checkpoint }}
    steps:
      - name: Resolve requested checkpoint
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_CHECKPOINT: ${{ inputs.checkpoint }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            checkpoint="$MANUAL_CHECKPOINT"
          elif [ "$EVENT_SCHEDULE" = "10 23 * * 0-4" ] || [ "$EVENT_SCHEDULE" = "35 23 * * 0-4" ]; then
            checkpoint="premarket"
          elif [ "$EVENT_SCHEDULE" = "0 1 * * 1-5" ] || [ "$EVENT_SCHEDULE" = "5 1 * * 1-5" ]; then
            checkpoint="0900"
          elif [ "$EVENT_SCHEDULE" = "30 1 * * 1-5" ] || [ "$EVENT_SCHEDULE" = "35 1 * * 1-5" ]; then
            checkpoint="0930"
          elif [ "$EVENT_SCHEDULE" = "30 2 * * 1-5" ] || [ "$EVENT_SCHEDULE" = "35 2 * * 1-5" ]; then
            checkpoint="1030"
          elif [ "$EVENT_SCHEDULE" = "0 5 * * 1-5" ] || [ "$EVENT_SCHEDULE" = "5 5 * * 1-5" ]; then
            checkpoint="1300"
          elif [ "$EVENT_SCHEDULE" = "10 6 * * 1-5" ] || [ "$EVENT_SCHEDULE" = "15 6 * * 1-5" ]; then
            checkpoint="1410"
          elif [ "$EVENT_SCHEDULE" = "30 6 * * 1-5" ] || [ "$EVENT_SCHEDULE" = "35 6 * * 1-5" ]; then
            checkpoint="1430"
          else
            echo "Unsupported schedule: $EVENT_SCHEDULE" >&2
            exit 1
          fi
          echo "checkpoint=$checkpoint" >> "$GITHUB_OUTPUT"

  premarket:
    needs: resolve-checkpoint
    if: needs.resolve-checkpoint.outputs.checkpoint == 'premarket'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require runtime secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: test -n "$CRON_SECRET"

      - name: Run the durable delivery watchdog
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$RUNNER_TEMP/daily-delivery-orchestrator.json"
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail-with-body \
              --max-time 600 \
              --request POST "$FUNCTIONS_BASE_URL/daily-delivery-orchestrator" \
              --header "Content-Type: application/json" \
              --header "x-cron-secret: $CRON_SECRET" \
              --data '{}' \
              --output "$response_file"; then
              if jq -e '.success == true and (.status == "SUCCEEDED" or .status == "DEGRADED" or .status == "SKIPPED")' "$response_file" >/dev/null; then
                exit 0
              fi
            fi
            jq -c '{success, status, phase, actions, premium_eligible, delivered, reason_codes, retry_after_seconds, error}' "$response_file" >&2 || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "::error title=Daily delivery watchdog failed::The durable recovery router did not acknowledge the checkpoint after 3 attempts." >&2
          exit 1

  intraday:
    needs: resolve-checkpoint
    if: needs.resolve-checkpoint.outputs.checkpoint == '0900' || needs.resolve-checkpoint.outputs.checkpoint == '0930' || needs.resolve-checkpoint.outputs.checkpoint == '1030' || needs.resolve-checkpoint.outputs.checkpoint == '1300'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait until the checkpoint snapshot window
        env:
          CHECKPOINT: ${{ needs.resolve-checkpoint.outputs.checkpoint }}
        run: |
          case "$CHECKPOINT" in
            0900) target_minutes=$((9 * 60)) ;;
            0930) target_minutes=$((9 * 60 + 30)) ;;
            1030) target_minutes=$((10 * 60 + 30)) ;;
            1300) target_minutes=$((13 * 60)) ;;
            *) echo "Unsupported checkpoint: $CHECKPOINT" >&2; exit 1 ;;
          esac
          now_minutes=$((10#$(TZ=Asia/Taipei date +%H) * 60 + 10#$(TZ=Asia/Taipei date +%M)))
          if [ "$now_minutes" -lt "$target_minutes" ]; then
            sleep $(((target_minutes - now_minutes) * 60))
          fi

      - name: Require runtime secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: test -n "$CRON_SECRET"

      - name: Check whether the intraday checkpoint is already complete
        id: checkpoint-state
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CHECKPOINT: ${{ needs.resolve-checkpoint.outputs.checkpoint }}
        run: |
          response_file="$RUNNER_TEMP/intraday-checkpoint-state.json"
          report_date=$(TZ=Asia/Taipei date +%F)
          if curl --silent --show-error --fail-with-body \
            --max-time 45 \
            --request POST "$FUNCTIONS_BASE_URL/get-report-payload" \
            --header "Content-Type: application/json" \
            --header "x-cron-secret: $CRON_SECRET" \
            --data "{\"report_date\":\"$report_date\"}" \
            --output "$response_file" \
            && jq -e --arg checkpoint "$CHECKPOINT" --arg report_date "$report_date" \
              '.report_date == $report_date and .payload.intraday_sync_status.windows[$checkpoint] == "ready"' \
              "$response_file" >/dev/null; then
            echo "already_complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch fresh intraday snapshots
        if: steps.checkpoint-state.outputs.already_complete != 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CHECKPOINT: ${{ needs.resolve-checkpoint.outputs.checkpoint }}
        run: |
          response_file="$RUNNER_TEMP/fetch-market-data.json"
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail-with-body \
              --max-time 180 \
              --request POST "$FUNCTIONS_BASE_URL/fetch-market-data-v10" \
              --header "Content-Type: application/json" \
              --header "x-cron-secret: $CRON_SECRET" \
              --data "{\"phase\":\"intraday\",\"checkpoint\":\"$CHECKPOINT\"}" \
              --output "$response_file"; then
              if jq -e --arg checkpoint "$CHECKPOINT" '.success == true and .phase == "intraday" and .checkpoint == $checkpoint and .snapshot_upserted_count >= 2' "$response_file" >/dev/null; then
                exit 0
              fi
            fi
            jq -c '{success, phase, snapshot_upserted_count, failed, timed_out}' "$response_file" >&2 2>/dev/null || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "::error title=Intraday snapshots unavailable::Fresh intraday evidence was not available after 3 attempts." >&2
          exit 1

      - name: Evaluate checkpoint with the fresh snapshot
        if: steps.checkpoint-state.outputs.already_complete != 'true' && needs.resolve-checkpoint.outputs.checkpoint != '0900'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CHECKPOINT: ${{ needs.resolve-checkpoint.outputs.checkpoint }}
        run: |
          response_file="$RUNNER_TEMP/opening-market-radar.json"
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail-with-body \
              --max-time 180 \
              --request POST "$FUNCTIONS_BASE_URL/opening-market-radar" \
              --header "Content-Type: application/json" \
              --header "x-cron-secret: $CRON_SECRET" \
              --data "{\"checkpoint\":\"$CHECKPOINT\"}" \
              --output "$response_file"; then
              if jq -e '.success == true and .checkpoint == env.CHECKPOINT' "$response_file" >/dev/null; then
                exit 0
              fi
            fi
            jq -c '{success, checkpoint, code, error}' "$response_file" >&2 2>/dev/null || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "::error title=Intraday checkpoint failed::The checkpoint did not complete after 3 attempts." >&2
          exit 1

  closing:
    needs: resolve-checkpoint
    if: needs.resolve-checkpoint.outputs.checkpoint == '1410' || needs.resolve-checkpoint.outputs.checkpoint == '1430'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require runtime secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: test -n "$CRON_SECRET"

      - name: Check whether closing verification is already complete
        id: closing-state
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$RUNNER_TEMP/closing-state.json"
          if curl --silent --show-error --fail-with-body \
            --max-time 45 \
            --request POST "$FUNCTIONS_BASE_URL/ma-ops-health-check" \
            --header "Content-Type: application/json" \
            --header "x-cron-secret: $CRON_SECRET" \
            --data '{"environment":"production","check_type":"closing","dry_run":true,"components":["closing-verification-status"]}' \
            --output "$response_file" \
            && jq -e '([.checks[] | select(.check_name == "closing-verification-status" and .status == "passed")] | length) == 1' "$response_file" >/dev/null; then
            echo "already_complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether today's sector rotation evidence is already complete
        id: sector-state
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$RUNNER_TEMP/sector-state.json"
          report_date=$(TZ=Asia/Taipei date +%F)
          if curl --silent --show-error --fail-with-body \
            --max-time 45 \
            --request POST "$FUNCTIONS_BASE_URL/get-report-payload" \
            --header "Content-Type: application/json" \
            --header "x-cron-secret: $CRON_SECRET" \
            --data "{\"report_date\":\"$report_date\"}" \
            --output "$response_file" \
            && jq -e --arg report_date "$report_date" \
              '.report_date == $report_date and (.payload.sector_rotation_scores | length) > 0 and all(.payload.sector_rotation_scores[]; .score_date == $report_date)' \
              "$response_file" >/dev/null; then
            echo "already_complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch fresh close snapshots
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CHECKPOINT: ${{ needs.resolve-checkpoint.outputs.checkpoint }}
        run: |
          response_file="$RUNNER_TEMP/fetch-close-data.json"
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail-with-body \
              --max-time 180 \
              --request POST "$FUNCTIONS_BASE_URL/fetch-market-data-v10" \
              --header "Content-Type: application/json" \
              --header "x-cron-secret: $CRON_SECRET" \
              --data "{\"phase\":\"close\",\"checkpoint\":\"$CHECKPOINT\"}" \
              --output "$response_file"; then
              if jq -e --arg checkpoint "$CHECKPOINT" '
                .success == true
                and .phase == "close"
                and .checkpoint == $checkpoint
                and .snapshot_upserted_count >= 2
                and (.tw_core_symbols_success | index("TAIEX") != null)
                and .tw_core_status.taiex == "ok"
              ' "$response_file" >/dev/null; then
                exit 0
              fi
            fi
            jq -c '{
              success,
              phase,
              trading_date,
              snapshot_upserted_count,
              tw_core_status,
              tw_core_symbols_success,
              tw_core_symbols_failed,
              failed,
              timed_out
            }' "$response_file" >&2 2>/dev/null || true
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "::error title=Missing TAIEX close evidence::Close verification stopped because a fresh TAIEX close snapshot was not available after 3 attempts." >&2
          exit 1

      - name: Build closing review from the fresh close snapshot
        if: steps.closing-state.outputs.already_complete != 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$RUNNER_TEMP/close-market-review.json"
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail-with-body \
              --max-time 180 \
              --request POST "$FUNCTIONS_BASE_URL/close-market-review" \
              --header "Content-Type: application/json" \
              --header "x-cron-secret: $CRON_SECRET" \
              --data '{}' \
              --output "$response_file"; then
              if jq -e '.success == true and (.action == "written_and_synced" or .action == "skipped_idempotent" or .pending == true or .skipped == true)' "$response_file" >/dev/null; then
                exit 0
              fi
            fi
            jq -c '{success, action, pending, skipped, error}' "$response_file" >&2 2>/dev/null || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "::error title=Closing review failed::The closing review did not complete after 3 attempts." >&2
          exit 1

      - name: Write closing verification v2
        if: steps.closing-state.outputs.already_complete != 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$RUNNER_TEMP/closing-verification-v2.json"
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail-with-body \
              --max-time 180 \
              --request POST "$FUNCTIONS_BASE_URL/closing-verification-engine" \
              --header "Content-Type: application/json" \
              --header "x-cron-secret: $CRON_SECRET" \
              --data '{}' \
              --output "$response_file"; then
              if jq -e '.success == true and (.closing_verification_status == "completed" or .closing_verification_status == "direction_completed_data_degraded")' "$response_file" >/dev/null; then
                exit 0
              fi
            fi
            jq -c '{
              success,
              code,
              error,
              status,
              closing_verification_status,
              verification_date,
              close_window_start,
              close_window_end,
              report_updated,
              no_fake_data
            }' "$response_file" >&2 2>/dev/null || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "::error title=Closing verification incomplete::The verification engine did not return a completed evidence state after 3 attempts." >&2
          exit 1

      - name: Run failure-isolated continuous learning review
        id: continuous-learning
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$RUNNER_TEMP/continuous-learning-engine.json"
          for attempt in 1 2; do
            if curl --silent --show-error --fail-with-body \
              --max-time 300 \
              --request POST "$FUNCTIONS_BASE_URL/continuous-learning-engine" \
              --header "Content-Type: application/json" \
              --header "x-cron-secret: $CRON_SECRET" \
              --data '{}' \
              --output "$response_file"; then
              if jq -e '.success == true and (.run_id != null or .skipped == true or .reused == true)' "$response_file" >/dev/null; then
                exit 0
              fi
            fi
            jq -c '{success, run_id, target_date, degraded, skipped, reused, error, failure_isolated}' "$response_file" >&2 2>/dev/null || true
            if [ "$attempt" -lt 2 ]; then sleep 20; fi
          done
          echo "::warning title=Learning engine isolated::Closing verification remains valid. The learning review failed separately and is recorded in learning_runs." >&2
          exit 1

      - name: Record non-blocking learning degradation
        if: steps.continuous-learning.outcome == 'failure'
        run: echo "Continuous learning is auxiliary and did not block the production report, LINE delivery, or closing verification."

      - name: Build sector rotation evidence for the next trading day
        if: steps.sector-state.outputs.already_complete != 'true'
        id: sector-rotation
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$RUNNER_TEMP/generate-sector-rotation.json"
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail-with-body \
              --max-time 300 \
              --request POST "$FUNCTIONS_BASE_URL/generate-sector-rotation" \
              --header "Content-Type: application/json" \
              --header "x-cron-secret: $CRON_SECRET" \
              --data '{}' \
              --output "$response_file"; then
              if jq -e '.success == true and (.score_date | type == "string")' "$response_file" >/dev/null; then
                exit 0
              fi
            fi
            jq -c '{success, score_date, skipped, error}' "$response_file" >&2 2>/dev/null || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          echo "::warning title=Sector rotation deferred::Closing verification completed, but next-day sector evidence was not generated after 3 attempts. The next premarket run will remain fail-closed and will not use stale sector evidence." >&2
          exit 1

      - name: Record non-blocking sector evidence degradation
        if: steps.sector-rotation.outcome == 'failure'
        run: |
          echo "Closing verification is complete. Sector rotation is auxiliary next-day evidence and was safely degraded; no stale evidence was promoted."
