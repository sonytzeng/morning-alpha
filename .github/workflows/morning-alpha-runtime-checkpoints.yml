name: Morning Alpha runtime checkpoints

on:
  schedule:
    # GitHub cron uses UTC. Queue early, then wait inside the job for the market window.
    - cron: '45 22 * * 0-4'
    - cron: '5 1 * * 1-5'
    - cron: '5 2 * * 1-5'
    - cron: '35 4 * * 1-5'
    - cron: '35 5 * * 1-5'
  workflow_dispatch:
    inputs:
      checkpoint:
        description: Runtime checkpoint to execute
        required: true
        type: choice
        options:
          - premarket
          - '0930'
          - '1030'
          - '1300'
          - closing

permissions:
  contents: read

concurrency:
  group: morning-alpha-runtime-${{ github.event.schedule || inputs.checkpoint || github.run_id }}
  cancel-in-progress: false

env:
  FUNCTIONS_BASE_URL: https://cttfzgvhiewfckydcrci.supabase.co/functions/v1

jobs:
  resolve-checkpoint:
    runs-on: ubuntu-latest
    outputs:
      checkpoint: ${{ steps.resolve.outputs.checkpoint }}
    steps:
      - name: Resolve requested checkpoint
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_CHECKPOINT: ${{ inputs.checkpoint }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            checkpoint="$MANUAL_CHECKPOINT"
          elif [ "$EVENT_SCHEDULE" = "45 22 * * 0-4" ]; then
            checkpoint="premarket"
          elif [ "$EVENT_SCHEDULE" = "5 1 * * 1-5" ]; then
            checkpoint="0930"
          elif [ "$EVENT_SCHEDULE" = "5 2 * * 1-5" ]; then
            checkpoint="1030"
          elif [ "$EVENT_SCHEDULE" = "35 4 * * 1-5" ]; then
            checkpoint="1300"
          elif [ "$EVENT_SCHEDULE" = "35 5 * * 1-5" ]; then
            checkpoint="closing"
          else
            echo "Unsupported schedule: $EVENT_SCHEDULE" >&2
            exit 1
          fi
          echo "checkpoint=$checkpoint" >> "$GITHUB_OUTPUT"

  premarket:
    needs: resolve-checkpoint
    if: needs.resolve-checkpoint.outputs.checkpoint == 'premarket'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait until the 07:05 Taipei publication window
        run: |
          now_minutes=$((10#$(TZ=Asia/Taipei date +%H) * 60 + 10#$(TZ=Asia/Taipei date +%M)))
          target_minutes=$((7 * 60 + 5))
          if [ "$now_minutes" -lt "$target_minutes" ]; then
            sleep $(((target_minutes - now_minutes) * 60))
          fi

      - name: Require runtime secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: test -n "$CRON_SECRET"

      - name: Fetch premarket reference snapshots
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$RUNNER_TEMP/fetch-premarket-data.json"
          curl --silent --show-error --fail-with-body \
            --request POST "$FUNCTIONS_BASE_URL/fetch-market-data-v10" \
            --header "Content-Type: application/json" \
            --header "x-cron-secret: $CRON_SECRET" \
            --data '{"phase":"premarket"}' \
            --output "$response_file"
          jq -e '.success == true and .phase == "premarket" and .snapshot_upserted_count >= 1' "$response_file" >/dev/null

      - name: Generate and verify today's report
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$RUNNER_TEMP/generate-daily-report.json"
          curl --silent --show-error --fail-with-body \
            --max-time 720 \
            --request POST "$FUNCTIONS_BASE_URL/generate-daily-report-v7" \
            --header "Content-Type: application/json" \
            --header "x-cron-secret: $CRON_SECRET" \
            --data '{}' \
            --output "$response_file"
          jq -e '.success == true and (.report_id | type == "string") and (.report_date | type == "string")' "$response_file" >/dev/null

      - name: Push today's LINE premarket brief
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$RUNNER_TEMP/line-daily-push.json"
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail-with-body \
              --request POST "$FUNCTIONS_BASE_URL/line-daily-push" \
              --header "Content-Type: application/json" \
              --header "x-cron-secret: $CRON_SECRET" \
              --data '{}' \
              --output "$response_file"; then
              if jq -e '
                .success == true
                and (
                  (.sent == true and .failed_count == 0)
                  or (.sent == false and (
                    .reason == "ALREADY_SENT"
                    or .reason == "NO_ACTIVE_SUBSCRIBERS"
                    or .reason == "MARKET_STATUS_NOT_OPEN"
                  ))
                )
              ' "$response_file" >/dev/null; then
                exit 0
              fi
            fi
            jq -c '{success, sent, reason, report_date, total_subscribers, eligible_count, already_sent_count, sent_count, failed_count}' "$response_file" >&2 || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "::error title=LINE premarket push failed::The LINE push did not complete after 3 idempotent attempts." >&2
          exit 1

  intraday:
    needs: resolve-checkpoint
    if: needs.resolve-checkpoint.outputs.checkpoint == '0930' || needs.resolve-checkpoint.outputs.checkpoint == '1030' || needs.resolve-checkpoint.outputs.checkpoint == '1300'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait until the checkpoint snapshot window
        env:
          CHECKPOINT: ${{ needs.resolve-checkpoint.outputs.checkpoint }}
        run: |
          case "$CHECKPOINT" in
            0930) target_minutes=$((9 * 60 + 25)) ;;
            1030) target_minutes=$((10 * 60 + 25)) ;;
            1300) target_minutes=$((12 * 60 + 55)) ;;
            *) echo "Unsupported checkpoint: $CHECKPOINT" >&2; exit 1 ;;
          esac
          now_minutes=$((10#$(TZ=Asia/Taipei date +%H) * 60 + 10#$(TZ=Asia/Taipei date +%M)))
          if [ "$now_minutes" -lt "$target_minutes" ]; then
            sleep $(((target_minutes - now_minutes) * 60))
          fi

      - name: Require runtime secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: test -n "$CRON_SECRET"

      - name: Fetch fresh intraday snapshots
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$RUNNER_TEMP/fetch-market-data.json"
          curl --silent --show-error --fail-with-body \
            --request POST "$FUNCTIONS_BASE_URL/fetch-market-data-v10" \
            --header "Content-Type: application/json" \
            --header "x-cron-secret: $CRON_SECRET" \
            --data '{"phase":"intraday"}' \
            --output "$response_file"
          jq -e '.success == true and .phase == "intraday" and .snapshot_upserted_count >= 2' "$response_file" >/dev/null

      - name: Evaluate checkpoint with the fresh snapshot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CHECKPOINT: ${{ needs.resolve-checkpoint.outputs.checkpoint }}
        run: |
          response_file="$RUNNER_TEMP/opening-market-radar.json"
          curl --silent --show-error --fail-with-body \
            --request POST "$FUNCTIONS_BASE_URL/opening-market-radar" \
            --header "Content-Type: application/json" \
            --header "x-cron-secret: $CRON_SECRET" \
            --data "{\"checkpoint\":\"$CHECKPOINT\"}" \
            --output "$response_file"
          jq -e '.success == true and .checkpoint == env.CHECKPOINT' "$response_file" >/dev/null

  closing:
    needs: resolve-checkpoint
    if: needs.resolve-checkpoint.outputs.checkpoint == 'closing'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require runtime secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: test -n "$CRON_SECRET"

      - name: Fetch fresh close snapshots
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$RUNNER_TEMP/fetch-close-data.json"
          for attempt in 1 2 3; do
            curl --silent --show-error --fail-with-body \
              --request POST "$FUNCTIONS_BASE_URL/fetch-market-data-v10" \
              --header "Content-Type: application/json" \
              --header "x-cron-secret: $CRON_SECRET" \
              --data '{"phase":"close"}' \
              --output "$response_file"
            if jq -e '
              .success == true
              and .phase == "close"
              and .snapshot_upserted_count >= 2
              and (.tw_core_symbols_success | index("TAIEX") != null)
              and .tw_core_status.taiex == "ok"
            ' "$response_file" >/dev/null; then
              exit 0
            fi
            jq -c '{
              success,
              phase,
              trading_date,
              snapshot_upserted_count,
              tw_core_status,
              tw_core_symbols_success,
              tw_core_symbols_failed,
              failed,
              timed_out
            }' "$response_file" >&2
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "::error title=Missing TAIEX close evidence::Close verification stopped because a fresh TAIEX close snapshot was not available after 3 attempts." >&2
          exit 1

      - name: Build closing review from the fresh close snapshot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$RUNNER_TEMP/close-market-review.json"
          curl --silent --show-error --fail-with-body \
            --request POST "$FUNCTIONS_BASE_URL/close-market-review" \
            --header "Content-Type: application/json" \
            --header "x-cron-secret: $CRON_SECRET" \
            --data '{}' \
            --output "$response_file"
          jq -e '.success == true and (.action == "written_and_synced" or .action == "skipped_idempotent" or .pending == true or .skipped == true)' "$response_file" >/dev/null

      - name: Write closing verification v2
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$RUNNER_TEMP/closing-verification-v2.json"
          curl --silent --show-error --fail-with-body \
            --request POST "$FUNCTIONS_BASE_URL/closing-verification-engine" \
            --header "Content-Type: application/json" \
            --header "x-cron-secret: $CRON_SECRET" \
            --data '{}' \
            --output "$response_file"
          if ! jq -e '.success == true and (.closing_verification_status == "completed" or .closing_verification_status == "direction_completed_data_degraded")' "$response_file" >/dev/null; then
            jq -c '{
              success,
              code,
              error,
              status,
              closing_verification_status,
              verification_date,
              close_window_start,
              close_window_end,
              report_updated,
              no_fake_data
            }' "$response_file" >&2
            echo "::error title=Closing verification incomplete::The verification engine did not return a completed evidence state." >&2
            exit 1
          fi

      - name: Build sector rotation evidence for the next trading day
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file="$RUNNER_TEMP/generate-sector-rotation.json"
          curl --silent --show-error --fail-with-body \
            --request POST "$FUNCTIONS_BASE_URL/generate-sector-rotation" \
            --header "Content-Type: application/json" \
            --header "x-cron-secret: $CRON_SECRET" \
            --data '{}' \
            --output "$response_file"
          jq -e '.success == true and (.score_date | type == "string")' "$response_file" >/dev/null
