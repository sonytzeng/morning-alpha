name: Official public source wiring candidate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  official-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - run: npm ci --ignore-scripts
      - run: node --experimental-strip-types --test tests/officialPublicAdmission.test.mjs tests/officialPublicAcquisition.test.mjs tests/officialPublicV1Evaluation.test.mjs tests/officialV1SourceJoin.test.mjs
      - run: deno check --no-lock research/recommendation-official-source-join.ts
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
