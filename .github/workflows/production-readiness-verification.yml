name: Verify production readiness

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Report date to verify (YYYY-MM-DD). Defaults to today in Asia/Taipei.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: verify-morning-alpha-production
  cancel-in-progress: false

jobs:
  dry-run-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      REPLAY_URL: https://cttfzgvhiewfckydcrci.supabase.co/functions/v1/strategy-replay-engine
    steps:
      - name: Require runtime secret
        run: test -n "$CRON_SECRET"

      - name: Resolve readiness report date
        id: readiness-date
        env:
          INPUT_REPORT_DATE: ${{ inputs.report_date }}
        run: |
          report_date="${INPUT_REPORT_DATE:-$(TZ=Asia/Taipei date +%F)}"
          if ! [[ "$report_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid report_date: $report_date" >&2
            exit 1
          fi
          echo "report_date=$report_date" >> "$GITHUB_OUTPUT"

      - name: Simulate the complete Monday lifecycle
        run: |
          response_file="$RUNNER_TEMP/full-day.json"
          curl --fail-with-body --silent --show-error \
            --request POST "$REPLAY_URL" \
            --header "Content-Type: application/json" \
            --header "x-cron-secret: $CRON_SECRET" \
            --header "x-correlation-id: $(cat /proc/sys/kernel/random/uuid)" \
            --data '{"simulation_mode":"full_day","simulation_date":"2026-08-24","dry_run":true,"source_status":{"TXF":"unavailable_entitlement"},"content_scores":[77,92]}' \
            --output "$response_file"
          jq -e '
            .success == true and
            .version == "MA_STRATEGY_REPLAY_V2" and
            .runtime_schema.ready == true and
            ([.runtime_schema.checks[] | select(.ready == true)] | length) == 3 and
            .simulation.result == "GO" and
            .simulation.writes_performed == 0 and
            .simulation.notifications_sent == 0 and
            ([.simulation.checkpoints[].checkpoint] == ["0900","0930","1030","1300","1410","1430"])
          ' "$response_file" >/dev/null
          jq '{success, version, simulation_mode, correlation_id, runtime_schema, result: .simulation.result, checkpoints: [.simulation.checkpoints[].checkpoint], writes_performed: .simulation.writes_performed, notifications_sent: .simulation.notifications_sent}' "$response_file"

      - name: Replay historical failure scenarios
        run: |
          response_file="$RUNNER_TEMP/historical-scenarios.json"
          curl --fail-with-body --silent --show-error \
            --request POST "$REPLAY_URL" \
            --header "Content-Type: application/json" \
            --header "x-cron-secret: $CRON_SECRET" \
            --header "x-correlation-id: $(cat /proc/sys/kernel/random/uuid)" \
            --data '{"simulation_mode":"historical_scenarios","dry_run":true}' \
            --output "$response_file"
          jq -e '
            .success == true and
            .matrix.result == "PASS" and
            .matrix.normal_day_count == 3 and
            .matrix.incomplete_day_count == 1 and
            .matrix.api_failure_count == 1 and
            all(.matrix.scenarios[];
              .no_duplicate_snapshot == true and
              .no_duplicate_notification == true and
              .no_production_write == true)
          ' "$response_file" >/dev/null
          jq '{success, simulation_mode, correlation_id, result: .matrix.result, normal_day_count: .matrix.normal_day_count, incomplete_day_count: .matrix.incomplete_day_count, api_failure_count: .matrix.api_failure_count}' "$response_file"

      - name: Replay recent content quality
        env:
          READINESS_REPORT_DATE: ${{ steps.readiness-date.outputs.report_date }}
        run: |
          response_file="$RUNNER_TEMP/content-quality.json"
          curl --fail-with-body --silent --show-error \
            --request POST "$REPLAY_URL" \
            --header "Content-Type: application/json" \
            --header "x-cron-secret: $CRON_SECRET" \
            --header "x-correlation-id: $(cat /proc/sys/kernel/random/uuid)" \
            --data "{\"simulation_mode\":\"content_quality\",\"dry_run\":true,\"target_date\":\"$READINESS_REPORT_DATE\",\"minimum_score\":90}" \
            --output "$response_file"
          jq -e --arg target_date "$READINESS_REPORT_DATE" '
            .success == true and
            .version == "MA_STRATEGY_REPLAY_V2" and
            .target_date == $target_date and
            .quality_gate_passed == true and
            .required_minimum_score == 90 and
            .report_count == 1 and
            .eligible_report_count == 1 and
            .blocked_report_count == 0 and
            .minimum_score >= 90 and
            .writes_performed == 0 and
            .notifications_sent == 0
          ' "$response_file" >/dev/null
          jq '{success, version, simulation_mode, correlation_id, target_date, quality_gate_passed, required_minimum_score, report_count, eligible_report_count, blocked_report_count, average_score, minimum_score, most_common_loss_dimensions, writes_performed, notifications_sent}' "$response_file"
