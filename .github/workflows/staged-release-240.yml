name: Staged Owner candidate 240
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  staged-fresh-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - env:
          NODE_OPTIONS: --experimental-strip-types
        run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Exact scoped source admission and affected regression
        id: admitted
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: node scripts/releases/staged-regression.mjs
      - name: A exact schema, RLS and two-function rollback
        if: steps.admitted.outputs.A == 'true'
        env:
          NODE_OPTIONS: --experimental-strip-types
          MA_ACCEPTANCE_CALENDAR_SCOPE: issue-238-calendar
          MA_TEST_DOCKER_CONTAINER: ma-acceptance-calendar-238
          MA_ISOLATED_TEST_DB: ma_six_bug_test591
        run: |
          docker run -d --name ma-acceptance-calendar-238 --network none --env POSTGRES_PASSWORD=isolated-ci-only postgres:17
          for attempt in $(seq 1 30); do
            if docker exec ma-acceptance-calendar-238 pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          docker exec ma-acceptance-calendar-238 pg_isready -h 127.0.0.1 -U postgres
          node tests/acceptanceCalendarDatabase.integration.mjs
      - name: B1 real fresh RLS and exact source rollback
        if: steps.admitted.outputs.B1 == 'true'
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: |
          deno check --no-lock supabase/functions/get-report-payload/index.ts
          node --experimental-strip-types tests/recommendationReaderFreshDatabase.integration.mjs
      - name: B2 immutable request, lost response, accepted proof and rollback
        if: steps.admitted.outputs.B2 == 'true'
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: |
          deno check --no-lock supabase/functions/line-daily-push/index.ts
          node --experimental-strip-types tests/lineTransportRecoveryDatabase.integration.mjs
      - name: C real SQL HTTP worker, lease, immutable lock, Outcome and rollback
        if: steps.admitted.outputs.C == 'true'
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: |
          deno check --no-lock supabase/functions/vnext-daily-research-v1/index.ts supabase/functions/recommendation-v2-forward-worker-v1/index.ts
          node --experimental-strip-types tests/vnextDailyDatabase.integration.mjs
      - name: Remove only this workflow's A isolated container
        if: always()
        run: docker rm -f ma-acceptance-calendar-238 2>/dev/null || true
