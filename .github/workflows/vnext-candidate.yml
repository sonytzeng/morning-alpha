name: VNext research candidate
on:
  pull_request:
    branches: [main, codex/member-main-integration-20261015, codex/official-source-wiring-20261020]
permissions:
  contents: read
jobs:
  vnext-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - env:
          NODE_OPTIONS: --experimental-strip-types
        run: npm ci
      - env:
          NODE_OPTIONS: --experimental-strip-types
        run: node --experimental-strip-types --test tests/vnextContracts.test.mjs tests/vnextValidation.test.mjs tests/vnextRealEvidence.test.mjs tests/vnextFoundation.test.mjs tests/vnextMember.test.mjs tests/vnextPublication.test.mjs tests/vnextResearchFunnel.test.mjs tests/vnextStockResearch.test.mjs tests/vnextPublicationReview.test.mjs tests/vnextAdmission.test.mjs tests/vnextBlockers.test.mjs tests/vnextClearance.test.mjs tests/vnextDailyIntelligence.test.mjs
      - name: Exact current hash ownership, strict Canonical receipt and acquisition trace controls
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: node --experimental-strip-types --test --test-concurrency=1 tests/vnextPredictionHashBudget.test.mjs tests/vnextPrelockStageBudget.test.mjs tests/v1ActualCanonicalReceiptStatus.test.mjs tests/vnextTraceValidationBudget.test.mjs tests/vnextSharedPreimage.test.mjs tests/vnextAcquisitionHandoff.test.mjs tests/vnextDailyRuntimeRecovery.test.mjs tests/vnextForwardCutoffRuntime.test.mjs
      - name: Current source and live inventory negative controls (no build race)
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: |
          node --test tests/ciNodeObserver.test.mjs
          node scripts/releases/observe-ci-node.mjs --max-old-space-size=512 --experimental-strip-types --test --test-concurrency=1 tests/vnextIntegrity.test.mjs tests/stagedReleaseIntegrity.test.mjs tests/marketNewsReportIntegrity.test.mjs tests/academyV11Integrity.test.mjs
      - name: Build member UI candidate (no Production deployment)
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: MA_VNEXT_BUILD_DIR=/tmp/ma-vnext-member-build node scripts/vnext/member-build.mjs
      - name: Disposable Auth, publication and RLS (not Production Owner proof)
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: node scripts/vnext/member-isolation.mjs
      - name: Owner approval transactions and current subscription entitlement (isolated only)
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: node --experimental-strip-types tests/vnextMemberRelease.integration.mjs
      - name: Legacy protection and new Free policy (real isolated Auth, NOT payment-provider E2E)
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: |
          node --experimental-strip-types --test tests/membershipPolicy.test.mjs
          node --experimental-strip-types tests/membershipPolicy.integration.mjs
      - name: Daily production wiring controls and real SQL HTTP worker (isolated only)
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: |
          node --experimental-strip-types --test tests/vnextDailyWiring.test.mjs
          node --experimental-strip-types tests/vnextDailyDatabase.integration.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: New worker and exact nonblocking hook type checks
        run: deno check --no-lock supabase/functions/vnext-daily-research-v1/index.ts supabase/functions/recommendation-v2-forward-worker-v1/index.ts supabase/functions/member-access/index.ts
